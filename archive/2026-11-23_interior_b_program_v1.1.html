<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Аудит ОП «Інтер’єр та просторовий дизайн»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: аналітичний журнал гаранта — шапка з індексом програми, вкладки-звіти, щільні таблиці з кольоровими зонами */
:root{
  --paper:#fbfbfa;--panel:#f3f4f2;--rule:#dcded9;--rule-soft:#e8e9e5;
  --ink:#16191c;--ink-2:#4d5358;--ink-3:#767d83;
  --deep:#1f4e79;--deep-soft:#e7eef5;
  --ok:#1b6b45;--ok-soft:#e3f0e8;--warn:#9a6400;--warn-soft:#fbf1dc;--bad:#a8322d;--bad-soft:#f8e6e4;
  --none:#eeefed;--c1:#cfe0ee;--c2:#4f84b3;--c2-ink:#ffffff;
  --after:#0f7a7a;--after-soft:#dff0ef;
  --ff-text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-lab:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15171a;--panel:#1d2024;--rule:#30343a;--rule-soft:#262a2f;
  --ink:#eceef0;--ink-2:#b2b9c0;--ink-3:#848c94;--deep:#7fb3e0;--deep-soft:#1b2a38;
  --ok:#5bbf8c;--ok-soft:#17291f;--warn:#e0a640;--warn-soft:#2c2414;--bad:#ef7b72;--bad-soft:#341c1b;
  --none:#22262a;--c1:#24394d;--c2:#5f97c8;--c2-ink:#0d1620;--after:#4fc2c0;--after-soft:#132a2a;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171a;--panel:#1d2024;--rule:#30343a;--rule-soft:#262a2f;
  --ink:#eceef0;--ink-2:#b2b9c0;--ink-3:#848c94;--deep:#7fb3e0;--deep-soft:#1b2a38;
  --ok:#5bbf8c;--ok-soft:#17291f;--warn:#e0a640;--warn-soft:#2c2414;--bad:#ef7b72;--bad-soft:#341c1b;
  --none:#22262a;--c1:#24394d;--c2:#5f97c8;--c2-ink:#0d1620;--after:#4fc2c0;--after-soft:#132a2a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--ff-text);margin:0}
.wrap{max-width:1640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--ff-lab);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(26px,4vw,38px);line-height:1.1}
h2{font-size:22px;line-height:1.2}
h3{font-size:16px}
p{margin:0}
.mono,.num{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--ff-lab);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
header.top{border-bottom:1px solid var(--rule);background:var(--panel)}
header.top .wrap{padding-block:22px 0;display:grid;gap:14px}
.headrow{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between}
.headrow > div{min-width:0}
.lede{max-width:68ch;color:var(--ink-2)}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
nav.tabs a{font-family:var(--ff-lab);font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:10px 14px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--paper);border-color:var(--rule);color:var(--deep);position:relative;top:1px}
nav.tabs a:focus-visible,button:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
main .wrap{padding-block:28px 64px}
section.view{display:grid;gap:22px}
section.view > *{min-width:0}
.sechead{display:grid;gap:6px;max-width:80ch}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g2 > *,.g4 > *{min-width:0}
.tile{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--paper);display:grid;gap:6px;align-content:start}
.tile .big{font-family:var(--ff-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tile .big .arr{color:var(--ink-3);font-size:18px}
.panel{background:var(--panel);border-radius:8px;padding:16px 18px;display:grid;gap:10px}
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}.tblwrap.noscroll{overflow:visible}table.fixed{table-layout:fixed;width:100%}table.fixed td{overflow-wrap:anywhere}table.fixed .cc{white-space:normal}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule-soft)}
th{font-family:var(--ff-lab);font-weight:600;font-size:12.5px;color:var(--ink-2);background:var(--panel);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:none}
td.c,th.c{text-align:center}
td.r,th.r{text-align:right}
.chip{display:inline-block;font-family:var(--ff-lab);font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.ok{background:var(--ok-soft);color:var(--ok)}
.warn{background:var(--warn-soft);color:var(--warn)}
.bad{background:var(--bad-soft);color:var(--bad)}
.neu{background:var(--none);color:var(--ink-2)}
.aft{background:var(--after-soft);color:var(--after)}
.code{font-family:var(--ff-mono);font-size:12.5px;font-weight:500}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px}
.prf{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.prf button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}.prf button[aria-pressed="true"]{background:var(--deep-soft);border-color:var(--deep);color:var(--ink);font-weight:600}.prf .sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid transparent}
.gfwrap{position:sticky;top:0;z-index:5;background:var(--paper);padding:6px 0 2px;margin-bottom:6px}.note.stage{border-left-color:var(--warn)}
.fgrid > *{min-width:0}.detail .cc{white-space:normal;max-width:100%}.detail .focus,.detail .evl li{overflow-wrap:anywhere}
.tpmode{display:inline-flex;margin:4px 0 12px}.tpmode button{font:inherit;font-size:14px;padding:6px 14px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);cursor:pointer}.tpmode button:first-child{border-radius:8px 0 0 8px}.tpmode button:last-child{border-radius:0 8px 8px 0;border-left:none}.tpmode button[aria-pressed="true"]{background:var(--deep);color:var(--paper);border-color:var(--deep)}
.ctgrid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start;margin-top:14px}@media (max-width:900px){.ctgrid{grid-template-columns:1fr}}
.ctlist{position:sticky;top:56px;max-height:calc(100vh - 70px);overflow:auto}
.ctrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;font:inherit;font-size:13px;background:none;border:1px solid transparent;border-radius:6px;padding:5px 6px;cursor:pointer;color:var(--ink)}.ctrow:hover{background:var(--rule-soft)}.ctrow[aria-pressed="true"]{background:var(--deep-soft);border-color:var(--deep)}
.ctrow .ctl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ctrow .ctbar{grid-column:1/-1}
.ctbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--rule-soft)}.ctbar span{display:block;height:100%}.b-unique{background:var(--ok)}.b-dev{background:var(--warn)}.b-near{background:var(--ink-3)}.b-repeat{background:var(--bad)}
.ctt td{vertical-align:top}.ctt .chip{white-space:normal;line-height:1.3}.cth{margin-bottom:6px}.ctt tr.ct-repeat td:first-child{box-shadow:inset 3px 0 var(--bad)}
#unTable td.tname{cursor:pointer}#unTable td.tname:hover{text-decoration:underline}#unTable tr.rowsel td{background-image:linear-gradient(rgba(31,78,121,.08),rgba(31,78,121,.08))}
td .ccl .cc{white-space:normal;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--ink-2);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--rule)}
/* heatmap */
.hm td.cell{width:46px;min-width:46px;text-align:center;font-family:var(--ff-mono);font-size:12px;padding:6px 2px;border-left:1px solid var(--paper)}
.v0{background:var(--none);color:var(--ink-3)}
.v1{background:var(--c1);color:var(--ink)}
.v2{background:var(--c2);color:var(--c2-ink)}
.vN{background:repeating-linear-gradient(45deg,var(--none) 0 4px,var(--paper) 4px 8px);color:var(--ink-3)}
.hm th.rot{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--ff-mono);font-size:11.5px;padding:8px 4px;text-align:left;white-space:nowrap}
.hm th.grp{text-align:center;font-size:11.5px}
.dupcount{font-family:var(--ff-mono);font-weight:500}
/* buttons */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 13px var(--ff-lab);padding:6px 12px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--paper)}
.seg button:hover{border-color:var(--deep)}
/* bars */
.bar{height:8px;border-radius:4px;background:var(--rule-soft);position:relative;min-width:60px}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:4px}
.zone{font-family:var(--ff-mono);font-size:12.5px;padding:1px 6px;border-radius:4px}
.z-ok{background:var(--ok-soft);color:var(--ok)}.z-warn{background:var(--warn-soft);color:var(--warn)}.z-bad{background:var(--bad-soft);color:var(--bad)}.z-na{background:var(--none);color:var(--ink-3)}
.card{border:1px solid var(--rule);border-radius:8px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wavehead{font-family:var(--ff-lab);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
svg text{font-family:var(--ff-lab)}
.note{border-left:3px solid var(--deep);padding:4px 0 4px 12px;color:var(--ink-2);max-width:85ch}

.cc{display:inline-flex;gap:4px;align-items:baseline;font-size:12.5px;background:var(--deep-soft);color:var(--ink);border-radius:5px;padding:1px 7px;margin:2px 4px 2px 0;white-space:nowrap}
.cc b{font-family:var(--ff-mono);font-weight:500;font-size:12px;color:var(--deep)}
.cc i{font-style:normal;color:var(--ink-3)}
.ccl{display:flex;flex-wrap:wrap;margin-top:4px}
.detail{border:1px solid var(--deep);border-radius:8px;padding:14px 16px;background:var(--paper);display:grid;gap:10px;align-content:start;min-width:0}
.detail h3{font-size:16px}
.dhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3 > *{min-width:0}
#prsvg .node,#prsvg .edge{cursor:pointer;transition:opacity .15s}

#prsvg .node.on rect{stroke-width:2.5}
#prsvg .edge.on .ln{stroke-width:3.5}
#prsvg .edge:hover .ln{stroke-width:3.5}
#prsvg .node:hover rect{stroke:var(--deep);stroke-width:2}
#prsvg .node:focus-visible rect,#prsvg .edge:focus-visible .ln{outline:none;stroke:var(--deep);stroke-width:3}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--deep-soft)}
.tpgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:900px){.tpgrid{grid-template-columns:1fr}}
.sticky{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.hm td.tname{min-width:220px;cursor:pointer}
.hm td.tname:hover{color:var(--deep);text-decoration:underline}
.hm td.pk{cursor:pointer}
.hm td.pk:hover{outline:2px solid var(--deep);outline-offset:-2px}
.hm td.sel{outline:3px solid var(--ink);outline-offset:-3px}
.hm tr.rowsel td.tname{font-weight:600;color:var(--deep)}
.hm tr.rowsel td{box-shadow:inset 0 2px 0 var(--deep),inset 0 -2px 0 var(--deep)}
.hm .colsel{box-shadow:inset 2px 0 0 var(--deep),inset -2px 0 0 var(--deep)}
.hm th.rot{height:190px;vertical-align:bottom}.hm tr.tblock td{background:var(--panel);font-weight:600;font-size:13.5px;padding:10px 8px 6px;text-align:left;border-top:2px solid var(--rule)}.hm tr.tblock .muted{font-weight:400}
.hm th.rot .code{color:var(--deep)}
.hm td.gap,.hm th.gap{width:6px;min-width:6px;padding:0;background:var(--paper);border:none}
.hm td.cell span{font-size:14px}
.v2c{background:var(--c2);color:var(--c2-ink)}.v1c{background:var(--c1);color:var(--ink)}
.focus{border:1px dashed var(--rule);border-radius:6px;padding:10px;display:grid;gap:6px}
ul.evl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.evl li{border-left:3px solid var(--rule);padding-left:8px}
ul.evl li.cur{border-left-color:var(--ink)}
.uh{min-width:64px;width:64px;vertical-align:bottom}
#unTable td.cell{width:64px;min-width:64px}.uh b{display:block;font-size:12.5px;color:var(--ink)}.uh span{display:block;font-family:var(--ff-mono);font-weight:400;font-size:11px;color:var(--ink-3)}
details.pc{border:1px solid var(--rule);border-radius:8px;background:var(--paper);overflow:hidden}
details.pc + details.pc{margin-top:8px}
details.pc summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 14px}
details.pc summary::-webkit-details-marker{display:none}
details.pc summary:hover{background:var(--panel)}
details.pc summary:focus-visible{outline:2px solid var(--deep);outline-offset:-2px}
details.pc .pcname{font-weight:600;flex:1 1 260px;min-width:0}
details.pc .pcmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.pc .arr{color:var(--ink-3)}
details.pc .tw{width:10px;height:10px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s;margin-left:4px}
details.pc[open] .tw{transform:rotate(-135deg)}
details.pc[open] summary{border-bottom:1px solid var(--rule);background:var(--panel)}
details.pc.new summary{border-left:4px solid var(--bad)}
details.pc.line summary{border-left:4px solid var(--deep)}
details.pc.pilot summary{border-left:4px solid var(--after)}
details.pc.pre summary{border-left:4px solid var(--rule)}
.pcbody{padding:14px;display:grid;gap:14px}
.verdict{font-size:15px;max-width:85ch}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{border-radius:8px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.col.rm{background:var(--bad-soft)}.col.ad{background:var(--ok-soft)}.col.kp{background:var(--panel)}
.colh{font-family:var(--ff-lab);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.col.rm .colh{color:var(--bad)}.col.ad .colh{color:var(--ok)}.col.kp .colh{color:var(--ink-3)}
.col .it{background:var(--paper);border-radius:6px;padding:8px 10px;display:grid;gap:3px;font-size:13.5px}
.col.rm .it{border-left:3px solid var(--bad)}.col.ad .it{border-left:3px solid var(--ok)}.col.kp .it{border-left:3px solid var(--rule)}
.it .ov{font-size:12.5px;color:var(--bad);font-weight:500}
.labs{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:10px;align-items:start}
.labs ol{margin:6px 0 0;padding-left:20px;display:grid;gap:3px;font-size:13.5px}
.labarr{font-size:22px;color:var(--after);text-align:center;padding-top:24px}
@media (max-width:640px){.labs{grid-template-columns:1fr}.labarr{display:none}}
.pgroup{display:grid;gap:0}
.pgroup h3{margin-bottom:8px}

.detail.float{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);padding-top:12px}
.xclose{position:sticky;top:0;justify-self:end;margin-bottom:-28px;width:28px;height:28px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);font-size:18px;line-height:1;cursor:pointer;z-index:2}
.xclose:hover{color:var(--ink);border-color:var(--deep)}
.hm td.cell{width:40px;min-width:40px}

.fgrid{display:grid;gap:12px}
.fcol{display:grid;gap:8px;align-content:start;min-width:0}
@media (min-width:900px){
 .detail.float{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-width:1608px;margin:0 auto;max-height:44vh}
 .fgrid{grid-template-columns:1.1fr 1.3fr .9fr;gap:20px}
}

[hidden]{display:none!important}
.schart{display:grid;gap:2px;overflow-x:auto}
.srow{display:grid;grid-template-columns:minmax(150px,240px) minmax(260px,1fr) 210px;gap:12px;align-items:center;padding:6px 6px;border:0;background:none;text-align:left;font:inherit;color:inherit;border-radius:6px;min-width:640px}
button.srow{cursor:pointer}button.srow:hover{background:var(--deep-soft)}
.slab{font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}.slab b{font-family:var(--ff-mono);font-weight:500;color:var(--deep)}
.strack{position:relative;height:22px}
.saxis .strack{height:16px}
.saxis .strack span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--ink-3);font-family:var(--ff-mono);white-space:nowrap}
.sbands span{position:absolute;top:8px;height:6px}
.b-bad{background:var(--bad-soft)}.b-bad2{background:var(--bad-soft);opacity:.6}.b-warn{background:var(--warn-soft)}.b-ok{background:var(--ok-soft)}
.sline{position:absolute;top:10px;height:2px;background:var(--ink-3)}
.sline.dash{background:repeating-linear-gradient(90deg,var(--after) 0 4px,transparent 4px 8px)}
.sp{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;display:block}
.sp.p0{background:var(--ink);border:2px solid var(--paper)}
.sp.p1{background:var(--paper);border:2px solid var(--ink);transform:rotate(45deg);border-radius:2px;width:12px;height:12px;margin-left:-6px;top:5px}
.sp.p2{background:var(--after);border:2px solid var(--paper)}
.snum{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-family:var(--ff-mono);font-size:12.5px}
.snum .arr{color:var(--ink-3)}
.sgroup{font-size:16px;font-weight:600;color:var(--ink);padding:18px 6px 6px;min-width:640px;border-bottom:1px solid var(--rule);margin-bottom:4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.sgroup .muted{font-weight:400;font-size:13px}.sgroup .gsw{display:inline-block;width:12px;height:12px;border-radius:3px}
#prsvg .dim{opacity:.45}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.roles > *{min-width:0}.role .cc{white-space:normal}.role .eyebrow{overflow-wrap:anywhere}
.role{border:1px solid var(--rule);border-radius:8px;padding:14px;display:grid;gap:8px;align-content:start;background:var(--paper)}
.role h3{font-size:16px}
.role .med{font-family:var(--ff-mono);font-size:26px;font-weight:500}
.role .tr{font-size:13px;font-weight:500}.role .tr.up{color:var(--ok)}.role .tr.down{color:var(--bad)}

черепа людини, виконуючи його конструктивну й світлотіньову побудову.»"}, "T02": {"ОК1.1": "Завдання: «Студенти виконують тональне або живописне дослідження геометричних фігур в ахроматичній гамі чи техніці гризайль, виявляючи світлотіньові градації та світловий домінант.»", "ОК1.2": "Завдання: «Студенти виконують конструктивно-тональний рисунок складної постановки, аналізуючи пластику складок тканини та її взаємодію з базовими геометричними об'ємами.»", "ОК1.3": "Завдання: «Лінійно-конструктивний та світлотіньовий рисунок черепа людини.»", "ОК1.11": "Завдання: «Студенти створюють живописну композицію в нюансній колористичній гамі, аналізуючи світлотіньові та тональні відношення при бічному освітленні.»", "ОК1.12": "Згадка: «Паралельно з вивченням кольору звертається увага на тональність кольорових плям, вишукується світловий домінант в композиції рисунка.»", "ОК1.14": "Згадка: «Лінійно-тональна перспектива побудови форм та їх складових»", "ОК2.1": "Завдання: «Види та техніки тональної графіки.»"}, "T03": {"ОК1.1": "Завдання: «Студенти виконують рисунки простих і складних геометричних моделей відносно лінії горизонту, в ізометрії чи лінійній перспективі, розробляють декоративний натюрморт на зіставлення фактур і створюють живописну копію класичного…»", "ОК1.11": "Згадка: «Натюрморт з античною головою в інтер’єрі.»"}, "T04": {"ОК1.1": "Завдання: «Студенти виконують тональне або живописне дослідження геометричних фігур в ахроматичній гамі чи техніці гризайль, виявляючи світлотіньові градації та світловий домінант.»", "ОК1.2": "Завдання: «Студенти виконують начерки й етюди пейзажу з натури, створюють графічну декоративно-площинну монокомпозицію урбаністичного пейзажу, живописний натюрморт у теплій гамі та поліхромну копію ландшафтного пейзажу.»", "ОК1.3": "Завдання: «Студенти створюють поліхромну живописну композицію, поєднуючи реалістичне трактування предметів із ритмічною організацією декоративних площин.»", "ОК1.11": "Завдання: «Студенти створюють живописну композицію в нюансній колористичній гамі, аналізуючи світлотіньові та тональні відношення при бічному освітленні.»", "ОК1.12": "Завдання: «Портрет з плечовим поясом (монохромія, контрастний фон)»", "ОК1.13": "Завдання: «Сидяча фігура натура з антуражем (поліхромія)»", "ОК1.14": "Завдання: «Колористична подача відомого живописного твору.»"}, "T05": {"ОК1.1": "Згадка: «Особлива увага приділяється роботі з кольором та тональністю на прикладі конкретних колористичних палітр — ахроматичної, мішаної та грецької, а також виявленню світлового домінанта в композиції.»", "ОК1.2": "Згадка: «Студенти опановують тональні й колірні співвідношення в холодному колориті, передаючи об'ємно-просторові характеристики предметного середовища.»", "ОК2.3": "Завдання: «Напівхроматична композиція: нюанс, контраст»"}, "T06": {"ОК1.1": "Завдання: «вчаться грамотно компонувати зображення у форматі аркуша»", "ОК1.13": "Згадка: «Створення тематичної монокомпозиції з фігурою людини (повний зріст, контрапост, сидяча) Формат А3»", "ОК1.14": "Завдання: «Закомпонувати твір на форматі, використавши обраний варіант ескізу.»", "ОК2.3": "Завдання: «Композиційна рівновага.»", "ОК2.1": "Завдання: «Графічні засоби побудови композицій.»", "ОК2.7": "Згадка: «Студенти опановують принципи співмасштабності людини і простору, ритмічну організацію площини та модульні системи пропорціонування (золотий перетин, тріангуляції, діагоналі квадратів, Модулор Ле Корбюзьє).»", "ОК2.21": "Згадка: «Основи композиції та візуальної культури.»", "ОК2.5": "Згадка: «Основи композиції в дизайні предметного середовища.»", "ОК2.20": "Завдання: «Основи композиції в дизайні предметного середовища.»", "ОК2.18": "Згадка: «Композиційне формотворення та проєктно-графічне моделювання.»"}, "T07": {"ОК1.1": "Завдання: «Самостійна робота: лінійно-конструктивні та декоративні студії.»", "ОК1.2": "Завдання: «Студенти створюють колористичну композицію в теплій палітрі, вибудовуючи ритм декоративних і локальних площин та виявляючи світловий домінант.»", "ОК1.3": "Завдання: «Студенти виконують начерки живих квітів, листя й гілок дерев, розробляють конструкцію ботанічної форми, створюють поліхромний квітковий натюрморт та його декоративну стилізацію.»", "ОК1.11": "Завдання: «узагальнену декоративну композицію на основі попередніх натюрмортів»", "ОК1.12": "Завдання: «Варіанти декоративної стилізації.Формат: довільний (від А 4).»", "ОК1.13": "Завдання: «Декоративно-площинна стилізація фігури людини.»", "ОК2.3": "Завдання: «Студенти виконують декоративну композицію у гуашевій чи комбінованій техніці на основі авторської стилізації тварини із застосуванням колірного контрасту чи нюансу.»"}, "T08": {"ОК1.3": "Завдання: «Студенти аналізують анатомічну будову та пропорції черепа людини, виконуючи його конструктивну й світлотіньову побудову.»", "ОК1.11": "Завдання: «Рисунок характерного зліпка голови.»", "ОК1.12": "Завдання: «4.Живопис.Жіночий поясний портрет з кистями рук (декоративно-площинне вирішення).Робота завершується позааудиторно, Формат А1 Самостійна робота студентів – 120 год.»", "ОК1.13": "Завдання: «Фігура гіпсової моделі або живої натури»", "ОК1.14": "Згадка: «Практичні заняття сприяють розвитку творчої самостійності студентів, поглиблюють знання з анатомії при зображеннях фігури, застосовують історичний творчий досвід аналогів культурно-мистецької спадщини, заохочують до…»"}, "T09": {"ОК1.1": "Згадка: «Завершальним етапом підготовки стає розвиток уміння рисувати «по пам'яті» та «по уяві», що сприяє формуванню естетичного смаку, мистецького мислення та індивідуальної творчої манери студента-дизайнера.»", "ОК1.2": "Завдання: «Студенти виконують начерки й етюди пейзажу з натури, створюють графічну декоративно-площинну монокомпозицію урбаністичного пейзажу, живописний натюрморт у теплій гамі та поліхромну копію ландшафтного пейзажу.»", "ОК1.3": "Завдання: «Студенти виконують начерки живих квітів, листя й гілок дерев, розробляють конструкцію ботанічної форми, створюють поліхромний квітковий натюрморт та його декоративну стилізацію.»", "ОК1.11": "Завдання: «Самостійна робота: зарисовки та трансформація зоологічних форм, декоративна композиція.»", "ОК1.12": "Завдання: «Кисті рук та стопи ніг з натури (начерки).»", "ОК1.13": "Завдання: «2.Короткочасні рисунки та начерки живої фігури людини в різних положеннях (Формат довільний).»"}, "T10": {"ОК1.2": "Завдання: «Студенти виконують начерки й етюди пейзажу з натури, створюють графічну декоративно-площинну монокомпозицію урбаністичного пейзажу, живописний натюрморт у теплій гамі та поліхромну копію ландшафтного пейзажу.»"}, "T11": {"ОК1.3": "Згадка: «розробляють конструкцію ботанічної форми»", "ОК1.11": "Згадка: «інтерпретують їх у конструктивну дизайн-пропозицію»", "ОК2.3": "Згадка: «Студенти створюють абстрактну або стилізовану колірну композицію та розробляють пропозицію її гармонійного просторового розміщення у житловому чи громадському приміщенні.»", "ОК2.4": "Завдання: «Об’ємні та об’ємно-просторові структури: статика і динаміка.»", "ОК2.18": "Згадка: «Композиційне формотворення та проєктно-графічне моделювання.»", "ВБ1.5": "Згадка: «Ергономіка, класифікація меблів та сучасні підходи до формотворення.»"}, "T12": {"ОК2.4": "Завдання: «Об’ємні макети»"}, "T13": {"ОК1.1": "У назві курсу «скульптура», але в «Описі» й «Короткому змісті» немає жодного завдання з ліплення чи об'ємного моделювання.", "ОК1.2": "У назві курсу «скульптура», але в «Описі» й «Короткому змісті» немає жодного завдання з ліплення чи об'ємного моделювання.", "ОК1.3": "У назві курсу «скульптура», але в «Описі» й «Короткому змісті» немає жодного завдання з ліплення чи об'ємного моделювання."}, "T14": {"ОК2.3": "Завдання: «Композиція інтер’єру»", "ОК2.7": "Завдання: «Студенти аналізують роль природного й штучного освітлення, типи художнього світла та світлових інсталяцій у формуванні емоційно-образного сприйняття простору.»", "ВБ1.8": "Згадка: «Композиційна організація, освітлення та предметне наповнення простору.»", "ВБ1.6": "Згадка: «Студенти вивчають історію та психологічний вплив тематичного дизайну, розробляють концепцію і легенду на основі культурного чи міфологічного контексту, опановують роботу із символікою, наративом, кольором, освітленням,…»", "ВБ2.4": "Згадка: «Зовнішнє освітлення в системі благоустрою.»", "ОК2.15": "Згадка: «Електропостачання, освітлення та слабкострумові системи.»"}, "T15": {"ОК2.4": "Згадка: «використовуючи гуаш, туш і маркери»", "ОК2.1": "Завдання: «Комплексне графічне відображення середовища»"}, "T16": {}, "T17": {"ОК1.1": "Завдання: «створюють живописну копію класичного натюрморту»", "ОК1.2": "Завдання: «поліхромну копію ландшафтного пейзажу»", "ОК1.13": "Завдання: «Копія живописного твору з антропоморфним зображенням»", "ОК1.14": "Завдання: «Колористична подача відомого живописного твору.»"}, "T18": {"ОК2.5": "Згадка: «Комбінаторика, модульність.»", "ОК2.20": "Завдання: «Комбінаторика, модульність.»", "ОК2.7": "Згадка: «Студенти опановують принципи співмасштабності людини і простору, ритмічну організацію площини та модульні системи пропорціонування (золотий перетин, тріангуляції, діагоналі квадратів, Модулор Ле Корбюзьє).»", "ВБ1.8": "Згадка: «Композиційна організація, освітлення та предметне наповнення простору.»"}, "T19": {"ОК2.5": "Згадка: «Оптичні ілюзії в предметному середовищі.»", "ОК2.20": "Завдання: «Оптичні ілюзії в предметному середовищі.»", "ОК2.7": "Згадка: «Пропорції та масштаб у просторовому дизайні.»", "ОК2.14": "Згадка: «Візуальні ілюзії та композиція середовища.»"}, "T20": {"ОК2.7": "Згадка: «Використання метафори та метонімії як художніх прийомів творення образу.»", "ОК2.6": "Згадка: «Сенс, наратив і простір.»", "ВБ1.6": "Згадка: «Студенти вивчають історію та психологічний вплив тематичного дизайну, розробляють концепцію і легенду на основі культурного чи міфологічного контексту, опановують роботу із символікою, наративом, кольором, освітленням,…»", "ВБ1.12": "Завдання: «Студенти досліджують вихідну ситуацію та її трансформативний потенціал, формують тематичну концепцію, наратив і функціональне зонування об’єкта з урахуванням принципів соціальної інклюзивності та нормативних вимог.»", "ВБ2.6": "Згадка: «Студенти вивчають типологію меморіальних об’єктів (пам’ятники, алеї, сакральні простори), засоби образотворчо-смислової виразності (метафора, символ, контрапункт, емоційність і тиша), просторові композиції сучасних меморіалів,…»", "ВБ2.12": "Завдання: «Студенти вивчають типологію меморіальних об’єктів (пам’ятники, алеї, сакральні простори), засоби образотворчо-смислової виразності (метафора, символ, контрапункт, емоційність і тиша), просторові композиції сучасних меморіалів,…»"}, "T22": {"ОК2.1": "Завдання: «Способи виконання текстур та фактур в чорно-білій графіці.»", "ОК2.2": "Силабуса немає; тема очікується за назвою компонента в ОП («Основи проектної та комп'ютерної графіки, частина 2»)."}, "T23": {"ВБ1.10": "Завдання: «У межах роботи над проєктом студенти опрацьовують планувальну структуру житла та виконують повний пакет технічної документації, що охоплює розділи креслень (обмірний план, плани монтажу й демонтажу, меблювання, стель,…»", "ВБ1.11": "Завдання: «Робоча документація, айдентика та візуалізація проєкту.»", "ВБ1.12": "Згадка: «Проєктний цикл охоплює аналіз вихідної ситуації, розроблення тематичної концепції та функціонального зонування, підготовку робочих креслень, колірно-фактурної карти, дизайну інтер’єрних деталей і логотипу, а також створення…»", "ВБ2.10": "Завдання: «Розроблення проєктного рішення та робочих креслень.»", "ВБ2.11": "Завдання: «Студенти виконують ескізи, 2D/3D-моделі, робочі креслення, специфікації й інструкції, готують презентаційні матеріали (портфоліо), проводять публічний захист курсового проєкту та здійснюють аналіз і рефлексію виконаної роботи.»", "ОК2.23": "Силабуса немає; тема очікується за назвою компонента в ОП («Обмірна практика»).", "ОК2.2": "Силабуса немає; тема очікується за назвою компонента в ОП («Основи проектної та комп'ютерної графіки, частина 2»)."}, "T24": {"ОК2.19": "Завдання: «Вступ до 3D-моделювання.»", "ВБ1.5": "Згадка: «Проєктування меблевого об’єкта та моделювання світильника.»", "ВБ1.13": "Згадка: «Візуалізація, розвиток та моделювання концепції.»", "ВБ2.13": "Завдання: «Завершальні етапи передбачають 3D-моделювання, підготовку візуалізацій і текстової документації, проміжну презентацію, доопрацювання та публічний захист курсового проєкту.»"}, "T25": {"ОК2.19": "Завдання: «Студенти знайомляться з базовими можливостями рендер-систем (Arnold, Scanline, V-Ray), налаштовують параметри візуалізації та збереження зображень.»", "ОК2.21": "Завдання: «Вступ до цифрової візуалізації в дизайні.»", "ВБ1.10": "Завдання: «Студенти виконують детальні креслення та візуалізацію авторських меблів і предметних елементів інтер'єру (кухні, кухонного острова, стелажів, столів тощо) із зазначенням габаритних і конструктивних розмірів, виносних пояснень…»", "ВБ1.11": "Завдання: «Робоча документація, айдентика та візуалізація проєкту.»", "ВБ1.12": "Завдання: «Візуалізація та представлення курсового проєкту.»", "ВБ1.13": "Завдання: «Візуалізація, розвиток та моделювання концепції.»", "ВБ2.11": "Завдання: «Візуалізація, технічна документація та захист проєкту.»", "ВБ2.13": "Завдання: «Моделювання, візуалізація та захист курсового проєкту.»"}, "T26": {"ОК2.21": "Завдання: «Віртуальні тури та інтерактивність.»", "ВБ2.7": "Згадка: «Студенти аналізують технології VR, AR і MR, творчість провідних митців (Джеймс Таррелл, teamLab), феномен «живого простору» в медіаархітектурі, інтерактивні музейні експозиції та імерсивну театральну сценографію.»"}, "T27": {"ОК2.21": "Завдання: «Студенти формують цілісний пакет презентаційних матеріалів (зображення, відео, інтерактивний тур) і готуються до публічного представлення проєкту.»", "ОК2.13": "Завдання: «Розробка та презентація концепції сталого середовища.»", "ВБ1.12": "Завдання: «Візуалізація та представлення курсового проєкту.»", "ВБ1.13": "Завдання: «Презентація та захист курсового проєкту.»", "ВБ2.5": "Згадка: «Взаємодія з міським середовищем, культурний контекст і презентація проєктів.»", "ВБ2.11": "Завдання: «Студенти виконують ескізи, 2D/3D-моделі, робочі креслення, специфікації й інструкції, готують презентаційні матеріали (портфоліо), проводять публічний захист курсового проєкту та здійснюють аналіз і рефлексію виконаної роботи.»", "ВБ2.13": "Завдання: «Завершальні етапи передбачають 3D-моделювання, підготовку візуалізацій і текстової документації, проміжну презентацію, доопрацювання та публічний захист курсового проєкту.»", "ОК2.22": "Згадка: «Студенти вивчають структуру ефективної презентації, методи візуалізації проєктних ідей, техніки впевненого мовлення й роботи з аудиторією під час захисту проєктів, а також навички ведення переговорів і підготовки професійної…»", "ОК2.26": "Завдання: «Дипломний проект (робота) за ОР підготовки бакалавра (бакалаврська кваліфікаційна робота) – випускна кваліфікаційна робота, виконання і захист якої відбувається на завершальному етапі навчання за ОР підготовки бакалаврів»"}, "T28": {"ОК2.9": "Згадка: «Засвоєння основних теоретичних понять мистецтва й архітектури від первісного часу до античності, вивчення та ідентифікація пам’яток на основі формального та іконологічного аналізів, а також розвиток фахової ерудиції,…»", "ОК2.10": "Згадка: «Курс висвітлює історичні етапи розвитку мистецтва та архітектури від античної класики й еллінізму до доби Бароко та Рококо, розглядаючи світоглядні чинники формування стилів і художніх образів.»"}, "T29": {"ОК2.11": "Силабуса немає; тема очікується за назвою компонента в ОП («Історія мистецтва, архітектури і дизайну, частина 3»).", "ОК2.12": "Згадка: «Український авангард.»"}, "T30": {"ОК2.12": "Згадка: «Феномен українського мистецтва.»", "ОК1.7": "Силабуса немає; тема очікується за назвою компонента в ОП («Історія державності і культури України»)."}, "T31": {"ВБ1.7": "Завдання: «Мета лекційних занять – надати студентам знання про методику формування і закономірності застосування стилів в дизайні інтер’єрів.»", "ОК1.14": "Завдання: «Вибір автором живописної картини (будь якого стилю та жанру).»", "ВБ1.6": "Згадка: «Формування у студентів розуміння концептуального підходу до дизайну інтер’єру, навчання створенню просторів із виразною ідеєю, стилістичною єдністю та культурним змістом, а також розвиток здатності мислити художньо, працювати…»"}, "T32": {"ОК2.18": "Згадка: «Теорія дизайну як основа проєктної культури та структура дизайн-діяльності.»", "ОК1.10": "Згадка: «Студенти вивчають ретроспективу теорії та методології дизайну, системну структуру дизайн-діяльності, співвідношення художнього дизайну й технічної естетики, визначення мети, стратегії та тактики проєктування, а також…»", "ОК2.17": "Згадка: «Психологічні теорії мистецтва.»"}, "T33": {"ОК1.10": "Завдання: «Професійна підготовка студента-дизайнера до практичної діяльності, що охоплює всі етапи роботи над проєктом — від передпроєктного аналізу та формулювання концепції до втілення й оцінювання результату.»", "ОК2.13": "Завдання: «Аналіз прикладів сталого дизайну.»", "ВБ1.11": "Завдання: «Передпроєктний етап та аналіз об’єкта дизайну.»", "ВБ1.12": "Завдання: «Передпроєктний аналіз та концептуалізація тематичного середовища.»", "ВБ1.13": "Завдання: «Передпроєктний аналіз та ідеація.»", "ВБ2.10": "Завдання: «Передпроєктний етап та аналіз вихідних умов.»", "ВБ2.11": "Завдання: «Передпроєктний аналіз та формування концепції.»", "ВБ2.13": "Завдання: «Передпроєктний аналіз та концептуалізація.»"}, "T34": {"ОК2.17": "Згадка: «Психологічний вплив творчості та її роль у психології дизайну.»", "ВБ1.6": "Згадка: «Програма охоплює пошук джерел натхнення й розроблення концептуальної легенди, роботу із символами, метафорами, кольором, світлом, фактурою й точкою фокусу, психологію сприйняття та мультисенсорний дизайн (звук, тактильність,…»", "ВБ2.7": "Згадка: «Теоретичні засади, історичні витоки та перцепція імерсивного простору.»"}, "T35": {"ВБ1.3": "Згадка: «Функціонально-просторові засади організації інтер’єру та принципи формування житлового середовища.»", "ВБ1.10": "Завдання: «Курс «Дизайн інтер'єрів житла (КП)» розрахований на один семестр навчання і структурно передбачає виконання комплексного курсового проєкту дизайну інтер'єру реальної квартири площею до 100 м².»", "ОК2.14": "Згадка: «Студенти розглядають функціонально-просторові особливості житлових, громадських, виробничих і рекреаційних просторів та оглядають систему державних будівельних норм, стандартів і технічних регламентів.»"}, "T36": {"ВБ1.4": "Завдання: «Теоретичні засади дизайну інтер'єрів громадських будівель.»", "ВБ1.11": "Завдання: «Студенти розробляють план монтажу й демонтажу перегородок, виконують функціональне зонування громадського приміщення площею від 100 кв.»", "ОК2.14": "Згадка: «Студенти розглядають функціонально-просторові особливості житлових, громадських, виробничих і рекреаційних просторів та оглядають систему державних будівельних норм, стандартів і технічних регламентів.»"}, "T37": {"ВБ1.5": "Завдання: «Розвиток знань і навичок студентів, пов’язаних з аспектами проєктування меблів та обладнання інтер’єрів, вибором сучасних матеріалів і технологічних рішень для формування комфортного, естетичного та ергономічного середовища,…»", "ВБ1.3": "Згадка: «Омеблювання житлового середовища.»", "ВБ1.8": "Згадка: «Ознайомлення студентів із сучасними тенденціями проєктування інтер’єрів та предметного обладнання громадських і житлових споруд, новітніми композиційними рішеннями, технологіями, інженерним забезпеченням і матеріалами в…»", "ОК2.8": "Згадка: «Курс, який пропонується до уваги студентів і викладачів вищих навчальних закладів III та IV рівнів акредитації базових напрямків «Інтер'єр та просторовий дизайн», дозволяє оволодіти сучасним методологічним і теоретичним…»"}, "T38": {"ВБ1.6": "Згадка: «Студенти вивчають історію та психологічний вплив тематичного дизайну, розробляють концепцію і легенду на основі культурного чи міфологічного контексту, опановують роботу із символікою, наративом, кольором, освітленням,…»", "ВБ1.12": "Завдання: «Студенти досліджують вихідну ситуацію та її трансформативний потенціал, формують тематичну концепцію, наратив і функціональне зонування об’єкта з урахуванням принципів соціальної інклюзивності та нормативних вимог.»", "ВБ1.13": "Завдання: «Студенти вивчають поняття дизайн-концепції та етапи раннього проєктування, аналізують цільову аудиторію й функціональний контекст, формулюють дизайн-завдання й бриф та застосовують практики генерації ідей (мозковий штурм,…»"}, "T39": {"ВБ1.1": "Згадка: «Програма складається з наступного змісту: Матеріали та вироби для практики дизайну-класифікація та вимоги.Вимоги та стандарти для комфортного середовища інтер’єрів.»", "ВБ1.9": "Завдання: «Програма складається з наступного змісту: Матеріали та вироби для практики дизайну-класифікація та вимоги.Вимоги та стандарти для комфортного середовища інтер’єрів.»", "ВБ2.1": "Згадка: «Програма складається з наступного змісту: Матеріали та вироби для практики дизайну-класифікація та вимоги.Вимоги та стандарти для комфортного середовища інтер’єрів.»", "ВБ2.9": "Завдання: «Програма складається з наступного змісту: Матеріали та вироби для практики дизайну-класифікація та вимоги.Вимоги та стандарти для комфортного середовища інтер’єрів.»", "ВБ1.3": "Згадка: «Конструктивні елементи, декоративні та оздоблювальні матеріали.»", "ВБ1.8": "Згадка: «Студенти вивчають ключові напрями розвитку індустрії інтер’єрного дизайну з акцентом на екологічний перехід, безпеку, нормативні вимоги, використання штучного інтелекту в проєктуванні інтер’єрів майбутнього, а також новітні…»", "ВБ2.8": "Згадка: «Студенти досліджують новітні будівельні системи, оздоблювальні матеріали та віконні конструкції, роль дизайну як способу самовираження в сучасному урбаністичному просторі й застосування інтелектуальних додатків і технологій…»", "ОК2.13": "Згадка: «Студенти знайомляться з методикою оцінки впливу дизайну на довкілля на всіх етапах життєвого циклу та будують практичні LCA-схеми для матеріалів і продуктів.»"}, "T40": {"ВБ1.2": "Згадка: «Детально розглядаються конструктивні елементи будівель — фундаменти, стіни, перекриття, стелі, підлоги, дахи, просторові покриття, вікна, двері та вертикальні комунікації (сходи, пандуси, ліфти, ескалатори).»", "ВБ1.3": "Згадка: «Студенти вивчають конструктивні особливості та принципи розрахунку внутрішньоквартирних сходів у багаторівневому житлі.»", "ВБ2.5": "Згадка: «Конструктивні рішення, сталість і безпека тимчасових споруд.»"}, "T41": {"ОК2.15": "Згадка: «Курс охоплює принципи проєктування, розміщення та естетичного поєднання мереж водопостачання, каналізації, опалення, вентиляції, кондиціонування, електропостачання, освітлення, слабкострумових мереж, систем безпеки,…»", "ВБ1.3": "Згадка: «Студенти знайомляться з основами світлотехнічного та акустичного розрахунків для забезпечення комфорту житлового простору.»", "ВБ2.4": "Згадка: «Зовнішнє освітлення в системі благоустрою.»"}, "T42": {"ВБ2.3": "Згадка: «Студенти вивчають еволюцію садово-паркових стилів від Стародавнього світу, Середньовіччя, Відродження і Бароко до пейзажного мистецтва XVIII–XIX ст., натуралістичних садів і ландшафтного дизайну доби урбанізації XX століття.»", "ВБ2.10": "Завдання: «У межах семестру студенти опановують історію садово-паркового мистецтва, типологію ландшафтних об’єктів, принципи побудови ландшафтної композиції та виконують індивідуальний курсовий проєкт з благоустрою й озеленення…»", "ОК2.5": "Згадка: «Ландшафтне середовище.»", "ОК2.20": "Згадка: «Ландшафтне середовище.»"}, "T43": {"ВБ2.2": "Згадка: «У межах програми студенти вивчають типологію ландшафтних об’єктів, принципи організації рельєфу й благоустрою, методи управління водними ресурсами (зрошення, збір дощових і відведення зливових вод), підбір рослин відповідно до…»"}, "T44": {"ВБ2.4": "Згадка: «У межах лекційного курсу студенти вивчають роль дизайнера в організації громадських просторів, принципи соціальної інклюзії й безпеки, типологію елементів благоустрою та міських меблів, їх культурно-естетичне наповнення,…»", "ОК2.5": "Згадка: «Міське середовище.»", "ОК2.20": "Згадка: «Міське середовище.»", "ВБ2.5": "Згадка: «Взаємодія з міським середовищем, культурний контекст і презентація проєктів.»"}, "T45": {"ВБ2.5": "Згадка: «Вибіркова навчальна дисципліна «Дизайн просторів для подій та масових заходів» присвячена проєктуванню тимчасових і постійних середовищ для культурних, соціальних, громадських та комерційних подій.»", "ВБ2.11": "Завдання: «Вибіркова навчальна дисципліна «Дизайн просторів для подій та масових заходів» (модуль 6.B02.05.E.066) реалізується у форматі практичних занять і самостійної роботи (45 годин практичних робіт) та спрямована на виконання…»", "ВБ2.13": "Завдання: «Вибіркова навчальна дисципліна «Сценографія простору» (модуль 6.B02.05.E.070) реалізується у форматі практичних занять і самостійної роботи (45 годин практичних робіт) та спрямована на виконання комплексного індивідуального…»"}, "T46": {"ВБ2.6": "Згадка: «Вибіркова навчальна дисципліна «Дизайн меморіальних та репрезентативних просторів» (модуль 6.B02.05.E.069) спрямована на формування навичок проєктування середовищ пам’яті та статусних публічних просторів.»", "ВБ2.12": "Завдання: «Вибіркова навчальна дисципліна «Дизайн меморіальних та репрезентативних просторів» (модуль 6.B02.05.E.069) спрямована на формування навичок проєктування середовищ пам’яті та статусних публічних просторів.»"}, "T47": {"ВБ2.7": "Згадка: «Студенти аналізують технології VR, AR і MR, творчість провідних митців (Джеймс Таррелл, teamLab), феномен «живого простору» в медіаархітектурі, інтерактивні музейні експозиції та імерсивну театральну сценографію.»", "ВБ2.13": "Завдання: «Проєктування експозиційних, ландшафтних та імерсивних елементів середовища.»", "ОК2.6": "Згадка: «Медіафасади: типи, технології, естетика.»", "ОК2.7": "Згадка: «Світловий дизайн та медіа-мистецтво.»"}, "T48": {"ОК2.6": "Згадка: «Студенти аналізують принципи візуальної послідовності та роль інформаційного дизайну у формуванні ідентичності міста, бренду чи інституції.»", "ОК2.5": "Згадка: «Інформаційний дизайн.»", "ОК2.20": "Згадка: «Інформаційний дизайн.»", "ВБ1.11": "Згадка: «Робоча документація, айдентика та візуалізація проєкту.»", "ВБ2.5": "Згадка: «Сценографія, візуальна ідентичність та цифрові технології.»"}, "T49": {"ОК2.14": "Згадка: «Курс охоплює історичну еволюцію середовищних типологій, класифікацію житлових, громадських, виробничих і рекреаційних просторів, а також вимоги державних будівельних норм, стандартів безпеки, безбар’єрності та інклюзивності.»", "ОК2.15": "Згадка: «Студенти вивчають класифікацію інженерних систем, їх місце в дизайні та вимоги ДБН, санітарних і пожежних норм.»", "ВБ1.2": "Згадка: «У межах курсу студенти опановують базову термінологію, класифікацію будівель і споруд, систему Державних будівельних норм України (ДБН), типологію житлового будівництва (від однородинних будинків до висотного житла), а також…»", "ВБ1.3": "Згадка: «Вибіркова навчальна дисципліна «Дизайн інтер’єрів житла» розкриває типологію просторів житлових будівель за функціональними ознаками та ознайомлює студентів із кількісними й якісними параметрами житлового середовища.»", "ОК2.5": "Згадка: «Методологія дизайну (функціональна типологія об’єктів, ергономічні особливості, естетика, технологія виробництва, економіка).»"}, "T50": {"ОК2.8": "Завдання: «Курс, який пропонується до уваги студентів і викладачів вищих навчальних закладів III та IV рівнів акредитації базових напрямків «Інтер'єр та просторовий дизайн», дозволяє оволодіти сучасним методологічним і теоретичним…»", "ОК2.14": "Згадка: «Нормативні вимоги до безпеки, доступності та інклюзивності.»", "ОК2.13": "Згадка: «Соціальні аспекти сталого дизайну та універсальний дизайн.»"}, "T51": {"ОК2.13": "Завдання: «У межах навчання студенти опановують методику оцінки життєвого циклу матеріалів і продуктів (LCA), пасивні й активні стратегії енергоефективності, критерії вибору вторинних, локальних і біоматеріалів.»", "ОК2.14": "Згадка: «Принципи екологічності, сталого розвитку та системного моделювання.»", "ОК2.15": "Згадка: «Енергоефективність, екологічні аспекти та координація мереж у проєкті.»", "ВБ2.8": "Згадка: «Студенти вивчають сучасні тенденції переходу від декоративності до функціональної зручності, екологічності та сталого розвитку, посткарбонні, постковідні й посттравматичні вимоги до житлового середовища, а також адаптацію…»", "ВБ2.5": "Згадка: «Студенти опановують засоби формування атмосфери події (світло, колір, звук), роль брендингу й інформаційного дизайну, а також інтеграцію імерсивних технологій (VR/AR) і мультимедійних інсталяцій.»"}, "T52": {"ВБ1.8": "Згадка: «Інноваційні тенденції, матеріали та технології в сучасному інтер’єрі.»", "ВБ2.8": "Згадка: «Програма охоплює екологічні та посткарбонні тренди, постковідні й посттравматичні особливості організації простору, сучасні стандарти комфорту з урахуванням кліматичних змін, новітні матеріали, будівельні системи й віконні…»", "ОК2.6": "Згадка: «Сучасні тренди в інформаційному дизайні середовища.»", "ОК2.14": "Згадка: «Окрема увага приділяється впровадженню новітніх технологій, цифрових інструментів і сучасних світових тенденцій у проєктну практику.»"}, "T53": {"ОК2.16": "Силабуса немає; тема очікується за назвою компонента в ОП («Основи охорони праці та безпеки життєдіяльності»).", "ОК2.15": "Згадка: «Безпека, автоматизація (Smart Home) та акустичний комфорт.»", "ВБ2.5": "Згадка: «Конструктивні рішення, сталість і безпека тимчасових споруд.»"}, "T54": {"ОК1.4": "Згадка: «Мова як суспільне явище.»"}, "T55": {"ОК1.5": "Силабуса немає; тема очікується за назвою компонента в ОП («Іноземна мова за професійним спрямуванням, частина 1»).", "ОК1.6": "Силабуса немає; тема очікується за назвою компонента в ОП («Іноземна мова за професійним спрямуванням, частина 2»)."}, "T56": {"ОК1.8": "Згадка: «Зміст, методи викладання, самостійна робота, форми проміжного і підсумкового контролю мають забезпечити ефективне виконання завдань з формування розуміння у студентів передумов та специфіки існування філософської парадигми,…»", "ОК1.7": "Силабуса немає; тема очікується за назвою компонента в ОП («Історія державності і культури України»)."}, "T57": {"ОК2.22": "Завдання: «Професійна комунікація та формування особистого бренду дизайнера.»", "ОК1.4": "Згадка: «Поняття етики ділового спілкування.»"}, "T58": {"ОК1.9": "Силабуса немає; тема очікується за назвою компонента в ОП («Маркетинг та менеджмент у дизайні»)."}, "T59": {"ОК1.15": "Згадка: «Мета вивчення навчальної дисципліни — формування у здобувачів вищої освіти системи базових знань, практичних умінь і навичок у сфері управління особистими фінансами, користування фінансовими послугами, планування доходів і…»"}, "T60": {"ОК2.25": "Завдання: «Дипломний проект (робота) за ОР підготовки бакалавра (бакалаврська кваліфікаційна робота) – випускна кваліфікаційна робота, виконання і захист якої відбувається на завершальному етапі навчання за ОР підготовки бакалаврів»", "ОК2.26": "Завдання: «Дипломний проект (робота) за ОР підготовки бакалавра (бакалаврська кваліфікаційна робота) – випускна кваліфікаційна робота, виконання і захист якої відбувається на завершальному етапі навчання за ОР підготовки бакалаврів»", "ОК2.24": "Силабуса немає; тема очікується за назвою компонента в ОП («Практика за темою кваліфікаційної бакалаврської роботи»)."}}, "uni_courses": {"Pratt Institute": [["FDC-140", "Visualization / Representation"], ["FDC-150", "Space, Form, Process"], ["FDC-160", "Light Color Design Lab"], ["INT-233/234", "Language of Drawing I–II"], ["INT-218", "Color Materials Lighting"], ["INT-342", "Time Culture Context"], ["INT-419", "The Working Set"], ["INT-325", "Emergent Platforms"], ["FDC-141", "Visualization/Representation/Concept"], ["FDC-180", "Time and Movement"], ["INT-441", "Positioning Practice Portfolio"], ["HAD-111/112", "Themes in Art and Culture I–II"], ["HAD-364", "History of Interior Design"], ["INT-405", "Design Research Strategies"], ["INT-326", "M віччя, Відродження і Бароко до пейзажного мистецтва XVIII–XIX ст", "unique", []], ["Предмет, типологія та закони ландшафтного дизайну", "Розглядають основні поняття і завдання ландшафтного проєктування, типологію об’єктів, єдність форми і змісту, а також закони перспективи, пропорцій, симетрії, асиметрії й кольорової гармонії", "unique", []], ["Ландшафт як матеріал та структура паркового простору", "Опановують методи оцінки пейзажних і естетичних якостей ландшафту", "unique", []], ["Ландшафт як матеріал та структура паркового простору", "Аналізують елементи паркового простору та принципи компонування зелених насаджень", "unique", []], ["Формування комфортного середовища засобами ландшафтного дизайну", "Вивчають декоративні властивості дерев, кущів і багаторічних трав’янистих рослин для створення якісного та комфортного відкритого середовища", "unique", []]], "ВБ2.4": [["Роль дизайнера та інтеграція об’єктів дизайну в міське середовище", "Вивчають поняття громадського простору й міського інтер'єру, принципи людиноцентричного проєктування, вимоги до комунікаційних і рекреаційних територій, а також засади соціальної інклюзії та безпеки", "unique", []], ["Елементи благоустрою та міські меблі: типологія, вимоги, функції", "Аналізують велосипедну й пішохідну інфраструктуру, засоби навігації, озеленення, мікрокліматичні рішення, вуличні меблі, санітарне, спортивне й ігрове обладнання", "unique", []], ["Культурно-естетичне наповнення та сучасні підходи до образного вирішення громадських просторів", "Опановують принципи стилістичної цілісності, багатофункційності, культурних інтервенцій та побудови просторових сценаріїв для площ, вулиць, прибудинкових територій і просторів біля закладів освіти", "unique", []], ["Зовнішнє освітлення в системі благоустрою", "Досліджують функціональне та архітектурно-художнє освітлення, світлову рекламу, ілюмінацію й новітні формати світлового дизайну", "unique", []]], "ВБ2.5": [["Теоретичні основи, класифікація та організація подієвого простор     return `<button type="button" class="srow" data-c="${c}"><div class="slab"><b>${c}</b> ${esc(SH(c))}${miss?' <span class="chip bad">${esc(U.missing_label)}</span>':''}${s[0]&&s[0].veto?' <span class="chip warn">вето</span>':''}</div>

  if(v==="same") return k==="next" ? `Обидва курси в ${PS(a)} семестрі: перенести ${b} у «супутні», а не «наступні».` : `Обидва курси в ${PS(a)} семестрі: ${a} не може бути попереднім для ${b}. Перенести в «супутні» або узгодити теми між викладачами.`;

function prMap(){

  const marker = k => `<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${COL[k]}"/></marker>`;
  const cred = nodes.reduce((a,c)=>a+(((U.prereq_info||{})[c]||[0])[0]||0),0);

}

  return `<h3 style="margin-top:22px">${esc(u2.title)}</h3><p class="muted">${esc(u2.lede)} Наведіть курсор на позначку — назва курсу.</p>
   <div class="tblwrap"><table class="hm"><thead><tr><th>Тема</th>${u2.unis.map(u=>`<th class="uh"><b><a href="${esc(u[3])}" target="_blank" rel="noopener">${esc(u[0])}</a></b><span>${esc(u[1])}</span></th>`).join("")}<th class="c">Разом</th><th>Де в лінії ВБ2</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="card"><h3>Що показує порівняння лінії 2</h3><ul class="clean">${u2.notes.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
}
function unBind(){
  const tb=$("#unTable"); if(!tb) return;
  const go=e=>{const n=e.target.closest(".pk"); if(!n) return; const t=D.topics.find(x=>x[0]===n.dataset.t);
    tb.querySelectorAll(".sel,.rowsel").forEach(x=>x.classList.remove("sel","rowsel")); n.classList.add("sel");
    const has=Object.entries(t[2]).filter(([c,v])=>v);
    if(!n.dataset.u){ const ut=D.uni_t[t[0]]||[]; const cnt=ut.filter(x=>x).length; n.closest("tr").classList.add("rowsel");
      const lv=v=>v===2?'<span class="chip v2c">● окремий курс</span>':v===1?'<span class="chip v1c">○ частина курсу</span>':v===0?'<span class="chip neu">немає в плані</span>':'<span class="chip neu">? немає даних</span>';
      const ud=$("#unDetail"); ud.hidden=false; ud.innerHTML=`<button type="button" class="xclose" aria-label="Закрити">×</button><div class="fgrid">
       <div><div class="wavehead">Тема</div><h3>${esc(t[1])}</h3><p>${cnt>=5?'<span class="chip ok">консенсус</span> ':""}<span class="chip neu">${cnt} із ${D.unis.length} програм</span></p>
        <div class="wavehead">У нашій програмі</div><div class="ccl">${has.length?has.map(([c,v])=>cchip(c,v===2?U.scale_short[2]:U.scale_short[1])).join(""):'<span class="chip bad">немає</span>'}</div></div>
       <div style="grid-column:span 2"><div class="wavehead">Як учать провідні програми</div><ul class="evl">${D.unis.map((u,i)=>`<li><div><b>${esc(u[0])}</b> <span class="small muted">${esc(u[2])}</span> ${lv(ut[i])}</div>${ut[i]?`<div class="small">${esc(uniCourse(u,t[0]))}</div>`:""}</li>`).join("")}</ul></div></div>`;
      return; }
    const u=D.unis.find(x=>x[0]===n.dataset.u);
    const ud=$("#unDetail"); ud.hidden=false; ud.innerHTML=`<button type="button" class="xclose" aria-label="Закрити">×</button><div class="fgrid"><div><div class="wavehead">${esc(u[0])} · ${esc(u[2])}</div><p><b>${esc(uniCourse(u,t[0]))}</b></p><p class="small muted">${esc(t[1])}</p></div>
      <div><div class="wavehead">У нашій програмі</div><div class="ccl">${has.length?has.map(([c,v])=>cchip(c,v===2?U.scale_short[2]:U.scale_short[1])).join(""):'<span class="chip bad">немає</span>'}</div></div>
      <div><div class="wavehead">Після хвилі 2</div><p>Власник: ${ownerChips(D.owner[t[0]])}</p></div></div>`;};
  tb.addEventListener("click",go); tb.addEventListener("keydown",e=>{if(e.key==="Enter")go(e)});
  floatClose("#unDetail",()=>tb.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel")));
}
function floatClose(sel,cb){const el=$(sel); new MutationObserver(()=>{document.body.style.paddingBottom=el.hidden?"":"46vh"}).observe(el,{attributes:true,attributeFilter:["hidden"]}); el.addEventListener("click",e=>{if(e.target.closest(".xclose")){el.hidden=true; cb&&cb();}}); document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!el.hidden){el.hidden=true; cb&&cb();}});}

/* ---------- Метрики ---------- */
let curCourse=U.default_course;
function vMetrics(){
  const P=D.prog;
  const progRows=P.map(p=>{const exp=EXP(p.s[1],p.s[2]);
   const fmt=v=>v==null?"н/д":p.key==="P8"?f1(v):pct(v);
   return `<tr><td class="code">${p.key}</td><td>${esc(p.name)}<div class="small muted">${esc(p.note)}</div></td>
    <td class="r"><span class="zone ${zone(p.s[0])}">${fmt(p.v[0])}</span></td><td class="r"><span class="zone ${zone(p.s[1])}">${fmt(p.v[1])}</span></td><td class="r"><span class="zone ${zone(p.s[2])}">${fmt(p.v[2])}</span></td>
    <td class="r num">${f1(p.s[0])} → ${f1(p.s[2])}</td>${K!=null?`<td class="r num">${f1(exp)}</td>`:""}</tr>`}).join("");
  return `<section class="view">
   <div class="sechead"><span class="eyebrow">Звіт 6</span><h2>Метрики до і після</h2>
   <p class="muted">${esc(U.metrics_lede)}</p></div>
   <h3>Програмний рівень</h3>
   <div class="tblwrap"><table><thead><tr><th>Код</th><th>Метрика</th><th class="r">Зараз</th><th class="r">Хвиля 1</th><th class="r">Хвиля 2</th><th class="r">Бал</th>${K!=null?'<th class="r">Очікувано</th>':""}</tr></thead><tbody>${progRows}
    <tr><td></td><td><b>Індекс програми</b></td><td class="r"><span class="zone ${zone(D.prog_index[0])}">${f1(D.prog_index[0])}</span></td><td class="r"><span class="zone ${zone(D.prog_index[1])}">${f1(D.prog_index[1])}</span></td><td class="r"><span class="zone ${zone(D.prog_index[2])}">${f1(D.prog_index[2])}</span></td><td></td>${K!=null?`<td class="r num"><b>${f1(EXP(D.prog_index[1],D.prog_index[2]))}</b></td>`:""}</tr>
   </tbody></table></div>
   <h3>Курсовий рівень · 24 метрики</h3><p class="small muted">${esc(U.metrics_course_note)}</p>
   <div class="cseg" id="cseg">${ORDER.map(([g,l0])=>[g,l0.filter(inG)]).filter(([g,l])=>l.length).map(([g,l])=>`<div class="cgrp"><span class="eyebrow">${esc(g)}</span><div class="seg">${l.map(c=>`<button type="button" data-c="${c}" aria-pressed="${c===curCourse}" title="${esc(NM(c))}">${c} <span class="bn">${esc(SH(c))}</span></button>`).join("")}</div></div>`).join("")}${(U.metrics_missing||[]).filter(inG).length?`<div class="cgrp"><span class="eyebrow">${esc(U.missing_label)}</span><div class="seg">${U.metrics_missing.filter(inG).map(c=>`<button type="button" disabled title="${esc(NM(c))}">${c} <span class="bn">${esc(SH(c))}</span></button>`).join("")}</div></div>`:""}</div>
   <div id="cdetail"></div>
  </section>`;
}
function renderCourse(){
  const c=curCourse, sc=D.cscores[c], vals=D.cm[c];
  const missing=!sc[0];
  const fmtV=(code,v)=>{ if(v==null) return "н/д"; if(["C1","E3","F2","G1"].includes(code)) return String(v).replace(".",","); if(["E1","E2","E4"].includes(code)) return f2(v); return pct(v);};
  const dims=Object.keys(D.dimn);
  const head=`<div class="grid g4">
    ${[0,1,2].map(i=>{const o=sc[i]; return `<div class="tile"><span class="eyebrow">${["Зараз","Хвиля 1","Хвиля 2"][i]}</span>
     <div class="big"><span class="zone ${o?zone(o.final):"z-na"}" style="font-size:inherit">${o?f1(o.final):"—"}</span>${o&&o.veto?`<span class="chip bad" title="правило вето: проблемна метрика у вимірі A або B">вето</span>`:""}</div>
     <span class="small muted">${o?`${zoneTxt(o.final)}${o.veto?` · сирий бал ${f1(o.raw)}`:""}`:esc(U.missing_label)}</span></div>`}).join("")}
    ${K!=null?`<div class="tile"><span class="eyebrow">Очікувано</span><div class="big num">${f1(EXP(sc[1].final,sc[2].final))}</div><span class="small muted">з поправкою на досвід пілоту</span></div>`:`<div class="tile"><span class="eyebrow">Без даних</span><div class="big num">${D.mdef.filter(m=>vals[m[0]].every(x=>x==null)).length} з 24</div><span class="small muted">метрик не обчислено — немає тематичного плану й годин</span></div>`}
   </div>`;
  const dimRow=`<div class="tblwrap"><table><thead><tr><th>Вимір</th><th class="r">Вага</th>${["Зараз","Хвиля 1","Хвиля 2"].map(t=>`<th class="r">${t}</th>`).join("")}</tr></thead><tbody>
   ${dims.map(d=>`<tr><td>${d} · ${esc(D.dimn[d])}</td><td class="r num">${Math.round(D.weights[d]*100)}%</td>${[0,1,2].map(i=>{const v=sc[i]?sc[i].dims[d]:null; return `<td class="r"><span class="zone ${zone(v)}">${v==null?"—":f1(v)}</span></td>`}).join("")}</tr>`).join("")}
   </tbody></table></div>`;
  const rows=D.mdef.map(m=>{const v=vals[m[0]]; const s=[0,1,2].map(i=>sc[i]?sc[i].scores[m[0]]:null);
    const tgt = m[4]==="band" ? `${pct(m[5][0])}–${pct(m[5][1])}` : (m[4]?"≥ ":"≤ ")+fmtV(m[0],m[5]);
    return `<tr><td class="code">${m[0]}</td><td>${esc(m[2])}<div class="small muted">${esc(m[3])} · ціль ${tgt}</div></td>
     ${[0,1,2].map(i=>`<td class="r"><span class="zone ${zone(s[i])}">${fmtV(m[0],v[i])}</span></td>`).join("")}</tr>`}).join("");
  $("#cdetail").innerHTML=`<div style="display:grid;gap:14px">
   <p><b>${c}</b> · ${esc(NM(c))}${missing?` <span class="chip bad">${esc(U.missing_label)} — значення проєктні</span>`:""}</p>
   ${head}<div class="grid g2"><div style="min-width:0">${dimRow}</div>
   <div class="card"><h3>Що рухає бал</h3><p class="small">${esc((X.paths[c]||R.course[c]||{}).verdict||"")}</p>
    ${sc[0]?`<p class="small">Проблемні метрики зараз: ${sc[0].problems.map(p=>`<span class="code">${p}</span>`).join(", ")||"немає"}.</p><p class="small">${sc[1].problems.length?`Після хвилі 1 лишаються: ${sc[1].problems.map(p=>`<span class="code">${p}</span>`).join(", ")} — це змістові метрики, їх закриває хвиля 2.`:"Після хвилі 1 проблемних метрик не лишається, вето знято."}</p>`:`<p class="small">Бал хвилі 1 — для документа, написаного за структурою з вкладки «Шляхи вдосконалення».</p>`}
   </div></div>
   <div class="tblwrap"><table><thead><tr><th>Код</th><th>Метрика</th><th class="r">Зараз</th><th class="r">Хвиля 1</th><th class="r">Хвиля 2</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="small muted">Колір — зона бала метрики: зелений ≥ 85, жовтий 70–84, червоний < 70; сірий «н/д» — немає даних, метрика не входить у бал. Вето: підсумок не вище 75, поки хоча б одна метрика вимірів A або B у проблемній зоні.</p></div>`;
  document.querySelectorAll("#cseg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.c===c));
}

/* ---------- Шляхи ---------- */
function pathCard(c){
  const p=X.paths[c]; const sc=D.cscores[c];
  const scoreTxt = sc ? (sc[0] ? `<span class="zone ${zone(sc[0].final)}">${f1(sc[0].final)}</span><span class="arr">→</span><span class="zone ${zone(sc[2].final)}">${f1(sc[2].final)}</span>` : `<span class="chip bad">новий документ</span> <span class="zone ${zone(sc[1].final)}">${f1(sc[1].final)}</span>`) : "";
  const rm=p.remove||[], ad=p.add||[], kp=p.keep||[];
  const labs = (p.labs_now&&p.labs_now.length) || (p.labs_new&&p.labs_new.length);
  return `<details class="pc ${p.group}" data-c="${c}">
   <summary><span class="code">${c}</span><span class="pcname">${esc(NM(c))}</span>
    <span class="pcmeta">${rm.length?`<span class="chip bad">− ${rm.length} прибрати</span>`:""}${ad.length?`<span class="chip ok">+ ${ad.length} додати</span>`:""}${scoreTxt}</span><span class="tw" aria-hidden="true"></span></summary>
   <div class="pcbody">
    <p class="verdict">${esc(p.verdict)}</p>
    <div class="cols3">
     ${rm.length?`<div class="col rm"><div class="colh">Прибрати або скоротити</div>${rm.map(x=>`<div class="it"><b>${esc(x[0])}</b>${x[1]&&x[1]!=="—"?`<div class="ov">перекривається з: ${esc(x[1])}</div>`:""}<div class="small">${esc(x[2])}</div></div>`).join("")}</div>`:""}
     <div class="col ad"><div class="colh">Додати</div>${ad.length?ad.map(x=>`<div class="it"><b>${esc(x[0])}</b>${x[1]?`<div class="small">${esc(x[1])}</div>`:""}</div>`).join(""):'<p class="small muted">нічого</p>'}</div>
     <div class="col kp"><div class="colh">Залишити</div>${kp.length?kp.map(x=>`<div class="it">${esc(x)}</div>`).join(""):'<p class="small muted">—</p>'}</div>
    </div>
    ${labs?`<div class="labs"><div><div class="colh">${esc(U.labs_now_label)}</div>${p.labs_now&&p.labs_now.length?`<ol>${p.labs_now.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<p class="small muted">${esc(U.missing_label)}</p>`}</div><div class="labarr" aria-hidden="true">→</div><div><div class="colh">${esc(U.labs_new_label)}</div><ol>${p.labs_new.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div></div>`:""}
    ${(p.w1||R.course[c]?.w1)?`<div class="labs w"><div><div class="colh">Хвиля 1 · формальні правки</div><ul class="clean small">${(p.w1||R.course[c].w1).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="labarr" aria-hidden="true"></div><div><div class="colh">Хвиля 2 · зміст</div><ul class="clean small">${(p.w2||R.course[c].w2).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`:""}
    ${sc?`<p class="small"><a href="#metrics" class="tometrics" data-c="${c}">Детальні метрики ${c} →</a></p>`:""}
   </div></details>`;
}
function vPaths(){
  const grp=(t,list,sub)=>`<div class="pgroup"><h3>${t}</h3>${sub?`<p class="small muted">${sub}</p>`:""}${list.map(pathCard).join("")}</div>`;
  return `<section class="view">
   <div class="sechead"><span class="eyebrow">Звіт 7</span><h2>Шляхи вдосконалення</h2>
   <p class="muted">${esc(U.paths_lede)}</p></div>
   <div class="seg"><button type="button" id="openAll">Розгорнути всі</button><button type="button" id="closeAll">Згорнути всі</button></div>
   ${U.path_groups.map(g=>[g[0],g[1].filter(inG),g[2]]).filter(g=>g[1].length).map(g=>grp(g[0],g[1],g[2])).join("")}
   <h3>Для лінії · рішення кафедри</h3>
   <div class="grid g2">${R.line.map(x=>`<div class="card"><h3>${esc(x.t)}</h3><p class="small">${esc(x.d)}</p></div>`).join("")}</div>
   <h3>Для наступного перегляду ОП · хвиля 3</h3>
   <div class="grid g2">${R.opp.map(x=>`<div class="card"><h3>${esc(x.t)}</h3><p class="small">${esc(x.d)}</p></div>`).join("")}</div>
  </section>`;
}
function paBind(){
  const o=$("#openAll"), c=$("#closeAll"); if(!o) return;
  o.addEventListener("click",()=>document.querySelectorAll("details.pc").forEach(d=>d.open=true));
  c.addEventListener("click",()=>document.querySelectorAll("details.pc").forEach(d=>d.open=false));
  document.querySelectorAll(".tometrics").forEach(a=>a.addEventListener("click",()=>{curCourse=a.dataset.c;}));

}

function vInputs(){
  const st={ok:["ok","ok"],advisory:["warn","варто"],pending:["neu","очікує"],blocking:["bad","блокує"]};
  return `<section class="view">
   <div class="sechead"><span class="eyebrow">Звіт 9 · вхідні дані</span><h2>Вхідні дані й припущення аудитора</h2>
   <p class="muted">Аудит побудовано лише на наданих документах. Тут — чого бракувало, що аудитор прийняв замість цього, як це вплинуло на висновки і що треба надати, щоб припущення зняти.</p></div>
   <div class="tblwrap"><table><thead><tr><th>№</th><th>Чого бракує</th><th>Що прийнято замість цього</th><th>Вплив на аудит</th><th>Як зняти</th></tr></thead><tbody>
   ${A.items.map(a=>`<tr><td class="code">${esc(a.id)}</td><td>${esc(a.missing)}</td><td class="small">${esc(a.assumed)}</td><td class="small">${esc(a.impact)}</td><td class="small">${esc(a.fix)}</td></tr>`).join("")}
   </tbody></table></div>
   <div class="grid g2">
    <div class="card"><h3>Документи, яких немає · ${META.missing.length}</h3><ul class="clean">${META.missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>
     <p class="small muted">Ці ОК враховано в структурі ОП і матрицях, але не в аналізі змісту.</p></div>
    <div class="card"><h3>Перевірка витягу</h3><p>Цитати-докази знайдено в тексті джерел: <b>${META.grounding.found} з ${META.grounding.total}</b> (${pct(META.grounding.share)}).</p>
     <p class="small muted">Рішення гаранта: «${esc(META.guarantor)}»</p></div>
   </div>
   <h3>Журнал перевірок</h3>
   <div class="tblwrap"><table><thead><tr><th>Перевірка</th><th>Результат</th><th>Стан</th></tr></thead><tbody>
   ${(META.journal||[]).map(c=>`<tr><td>${esc(c.check)}</td><td class="small">${esc(c.result)}</td><td><span class="chip ${(st[c.status]||["neu",c.status])[0]}">${(st[c.status]||["neu",c.status])[1]}</span></td></tr>`).join("")}
   </tbody></table></div>
  </section>`;
}
const RENDER={summary:vSummary,passport:vPassport,prereq:vPrereq,topics:vTopics,market:vMarket,unis:vUnis,metrics:vMetrics,paths:vPaths,inputs:vInputs};
function route(){
  let v=(location.hash||"").slice(1); if(!RENDER[v]) v="summary";
  $("#tabs").innerHTML=VIEWS.map(([k,t])=>`<a href="#${k}" ${k===v?'aria-current="page"':""}>${t}</a>`).join("");
  const sn=(U.stage_note||{})[v];
  $("#app").innerHTML=(GMODE?`<div class="gfwrap" id="gfBar">${prFilters()}</div>`:"")+(sn?`<p class="note stage">${esc(sn)}</p>`:"")+RENDER[v]();
  if(GMODE && v==="metrics" && !inG(curCourse)){ const f=ORDER.flatMap(o=>o[1]).find(inG); if(f) curCourse=f; }
  if(v==="summary") document.querySelectorAll(".srow[data-c]").forEach(b=>b.addEventListener("click",()=>{curCourse=b.dataset.c; location.hash="metrics";}));
  if(v==="prereq") prBind(); if(v==="topics"){ if(tpMode==="course") ctBind(); else tpBind(); document.querySelectorAll(".tpmode button").forEach(b=>b.addEventListener("click",()=>{tpMode=b.dataset.m; const y=window.scrollY; route(); window.scrollTo(0,y);})); } if(v==="unis") unBind(); if(v==="paths") paBind();
  if(v==="metrics"){ renderCourse(); $("#cseg").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; curCourse=b.dataset.c; renderCourse();}); }
}
document.getElementById("hEyebrow").textContent=META.eyebrow; document.getElementById("hTitle").textContent=META.h1; document.getElementById("hLede").textContent=META.lede;
document.getElementById("foot").innerHTML=META.footer.map(s=>`<span>${esc(s)}</span>`).join("");
document.addEventListener("click",e=>{const b=e.target.closest("#gfBar button[data-f]"); if(!b) return; const f=b.dataset.f; gfInit();
  if(f==="all"){prOn=new Set((U.groups||U.prereq_groups).map(g=>g.k));} else { if(prOn.has(f)){ if(prOn.size>1) prOn.delete(f);} else prOn.add(f); }
  const y=window.scrollY; route(); window.scrollTo(0,y);});
headIdx(); route(); window.addEventListener("hashchange",()=>{route(); window.scrollTo({top:0});});
</script>
