# Який постачальник і модель виконує кожен агентний крок.
# Перенесення на іншу модель = змінити тут + прогнати еталонні тести (tests/).
# Рецензент бажано на іншій моделі, ніж автор (див. ТЗ, «Перевірка якості»).

[default]
provider = "anthropic"
model = "claude-opus-5-5"
max_retries = 2

[steps.inventory]   # класифікація файлів — легка модель
# model = "…"

[steps.extract]     # витяг корпусу з цитатами
[steps.research]    # зовнішній попит і провідні програми (веб-пошук)
[steps.review]      # агенти-рецензенти
[steps.fix]         # точкові виправлення
