[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-edu-audit"
version = "0.1.0"
description = "AI-Edu Audit: автоматичний аудит освітніх програм (пілот)"
requires-python = ">=3.10"
authors = [{ name = "Ярослав Виклюк" }]
dependencies = ["jsonschema>=4.18", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
agents = ["claude-agent-sdk"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_edu_audit = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
